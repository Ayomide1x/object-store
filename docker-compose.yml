# One Postgres, one coordinator, four storage nodes, two HTTP gateways. Each
# chunk is placed on three of the four nodes. Every port is bound to 127.0.0.1
# only: there is no authentication.
#
# Memory: every service has a hard limit (mem_limit, with memswap_limit equal
# so it can't spill into swap). The limits come from worst-case bounds, not
# measured averages; DECISIONS.md "Memory limits from worst-case bounds"
# (stage 9), its amendment for the nodes and "Gateway memory limit from
# worst-case bounds" (stage 10) have the arithmetic. About 4.25 GiB in total.
#
# OBJECTSTORE_DB_PASSWORD sets the Postgres password for both Postgres and the
# coordinator. Unset, it is "objectstore", for local development only: set it
# (for example in a gitignored .env; see .env.example) for anything else.

# Settings shared by both gateways.
x-gateway: &gateway
  build:
    context: .
    dockerfile: gateway/Dockerfile
  # 8 uploads x ~10 MiB + 16 downloads x ~6 MiB + ~16 MiB baseline = ~192 MiB
  # live at most (151 MiB measured with both caps full). GOMEMLIMIT (224MiB,
  # below) makes Go's GC work harder before the heap passes that; it is a soft
  # limit, and at full load the heap overshoots it while a collection runs
  # (to ~270 MiB measured, plus ~16 MiB of socket and kernel memory). The
  # container limit leaves room for that: DECISIONS.md, "Gateway memory limit
  # from worst-case bounds".
  mem_limit: 384m
  memswap_limit: 384m
  # Healthy once the gateway answers /healthz: the process is serving HTTP.
  # It does not check the coordinator, so a coordinator outage doesn't get
  # healthy gateways restarted; scripts wait on GET /cluster for that.
  healthcheck:
    test: ["CMD", "/gateway", "health"]
    start_period: 10s
    start_interval: 1s
    interval: 10s
    timeout: 3s
    retries: 3
  depends_on:
    coordinator:
      condition: service_healthy

# Settings shared by every storage node.
x-node: &node
  build:
    context: .
    dockerfile: node/Dockerfile
  # 32 reads x ~5.1 MiB + 16 writes x ~3.1 MiB + ~16 MiB baseline = ~230 MiB
  # live at most (222 MiB measured with both caps full). GOMEMLIMIT (288MiB,
  # per node below) makes Go's GC work harder before the heap passes that; it
  # is a soft limit, and at full load the heap overshoots it while a
  # collection runs (to ~381 MiB measured, plus ~56 MiB of kernel and socket
  # memory). The container limit leaves room for that: DECISIONS.md, "Node
  # memory limit amended: GOMEMLIMIT is not a ceiling" (stage 10).
  mem_limit: 576m
  memswap_limit: 576m
  # Healthy once the node's gRPC health service reports SERVING, which it does
  # only after stray temp files are cleaned and the listener is open. The image
  # is distroless (no shell), so the node binary probes itself. `docker compose
  # up --wait` blocks on this.
  healthcheck:
    test: ["CMD", "/node", "health"]
    start_period: 30s
    start_interval: 1s
    interval: 10s
    timeout: 3s
    retries: 3

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: objectstore          # database name
      POSTGRES_USER: objectstore        # superuser created on first start
      POSTGRES_PASSWORD: ${OBJECTSTORE_DB_PASSWORD:-objectstore}
    # shared_buffers 128 MB (the default) + up to 10 coordinator connections.
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql      # PG18 image mount point
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objectstore -d objectstore"]
      interval: 2s
      timeout: 3s
      retries: 30

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/objectstore   # metadata database
      SPRING_DATASOURCE_USERNAME: objectstore
      SPRING_DATASOURCE_PASSWORD: ${OBJECTSTORE_DB_PASSWORD:-objectstore}
      # Heap at most half the container limit (384 MiB of 768 MiB); the rest
      # is for metaspace, code cache, threads and gRPC's direct buffers,
      # capped at 64 MiB (the coordinator carries no object bytes, so its
      # messages are small). The JVM prints "Picked up JAVA_TOOL_OPTIONS".
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:MaxDirectMemorySize=64m"
      SPRING_GRPC_SERVER_PORT: "9090"                                       # coordinator gRPC port
      # Storage nodes, comma-separated node_id|internal_addr|client_addr.
      # internal_addr: how the coordinator reaches a node (StatChunks at commit).
      # client_addr: returned to osctl on the host.
      COORDINATOR_NODES: >-
        node1|node1:9101|127.0.0.1:9101,node2|node2:9102|127.0.0.1:9102,node3|node3:9103|127.0.0.1:9103,node4|node4:9104|127.0.0.1:9104
      # Deadline for each call to a node. A hung node costs this once per
      # CompleteUpload: each node gets one batched StatChunks call.
      COORDINATOR_NODE_RPC_TIMEOUT: 2s
      # Seconds the JVM caches DNS lookups (successful and failed). Node
      # containers can get new IPs on restart; a long cache keeps calling the
      # old address. On UNAVAILABLE the coordinator also re-resolves and retries.
      COORDINATOR_DNS_CACHE_TTL_SECONDS: "1"
      # Liveness from node heartbeats, judged by the coordinator's own clock.
      # ALIVE -> SUSPECT after this much silence:
      COORDINATOR_SUSPECT_AFTER: 6s
      # -> DEAD after this much (also: never heard from this long after startup):
      COORDINATOR_DEAD_AFTER: 15s
      # Consecutive beats, each within SUSPECT_AFTER, that bring a DEAD node back:
      COORDINATOR_RECOVERY_BEATS: "2"
      # How often timeouts are applied and transitions persisted to the nodes table:
      COORDINATOR_LIVENESS_SWEEP: 1s
      # Re-replication. A replica stops counting once its node has been DEAD
      # this long; then the reconciler copies the chunk node to node:
      COORDINATOR_REPAIR_GRACE: 30s
      # Time between reconciler passes (sooner on a hint: a replica marked BAD,
      # a commit with fewer than 3 replicas, a node becoming ALIVE):
      COORDINATOR_REPAIR_INTERVAL: 10s
      # Copies at once, cluster-wide and per node (as source or target):
      COORDINATOR_REPAIR_MAX_INFLIGHT: "8"
      COORDINATOR_REPAIR_MAX_PER_NODE: "2"
      # Deadline for one node-to-node copy:
      COORDINATOR_COPY_TIMEOUT: 30s
      # How long rows in the repair_passes table are kept:
      COORDINATOR_REPAIR_PASS_RETENTION: 24h
      # Garbage collection. Time between passes:
      COORDINATOR_GC_INTERVAL: 10s
      # DEMO VALUES: the next two are shortened so the acceptance scripts finish
      # in minutes. Production should use the code defaults, 15m and 24h.
      # How long a superseded or removed object's files (and a BAD replica's
      # file) are kept, so a get that already holds the chunk list finishes:
      COORDINATOR_GC_READ_GRACE: 60s
      # How long an upload may stay PENDING before it is abandoned and its
      # chunk files deleted; must exceed the longest legitimate upload:
      COORDINATOR_GC_PENDING_TIMEOUT: 120s
      # Objects retired or scheduled per pass step, and chunk IDs per DeleteChunks call:
      COORDINATOR_GC_BATCH: "256"
      # DeleteChunks calls at once, cluster-wide and per node:
      COORDINATOR_GC_MAX_INFLIGHT: "4"
      COORDINATOR_GC_MAX_PER_NODE: "1"
      # How long rows in the gc_passes table are kept:
      COORDINATOR_GC_PASS_RETENTION: 24h
    mem_limit: 768m
    memswap_limit: 768m
    ports:
      - "127.0.0.1:9090:9090"
    # Healthy once the gRPC server accepts connections, which happens only after
    # Flyway migrations and node registration finish. The probe runs inside the
    # container, so it reaches the real listener, not Docker's host port proxy.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090"]
      start_period: 60s     # JVM start + Flyway; failures here don't count
      start_interval: 1s    # probe rate during start_period
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  # NODE_ID must match an entry in COORDINATOR_NODES. NODE_LISTEN_ADDR uses the
  # same port inside the container and on the host. NODE_DATA_DIR holds chunk
  # files in chunks/ and in-progress writes in tmp/. NODE_MAX_CONCURRENT_READS:
  # reads beyond this get RESOURCE_EXHAUSTED; each holds up to 4 MiB in memory.
  # NODE_MAX_CONCURRENT_WRITES: the same for writes; each holds about 3 MiB in
  # gRPC buffers. GOMEMLIMIT: Go's soft memory limit, under mem_limit above.
  # COORDINATOR_ADDR is where heartbeats go; NODE_HEARTBEAT_INTERVAL how often
  # (with +/-10% jitter). Nodes keep serving while the coordinator is down.
  node1:
    <<: *node
    environment:
      NODE_ID: node1
      NODE_LISTEN_ADDR: ":9101"
      NODE_DATA_DIR: /data
      NODE_MAX_CONCURRENT_READS: "32"
      NODE_MAX_CONCURRENT_WRITES: "16"
      GOMEMLIMIT: 288MiB
      COORDINATOR_ADDR: coordinator:9090
      NODE_HEARTBEAT_INTERVAL: 2s
    ports:
      - "127.0.0.1:9101:9101"
    volumes:
      - node1-data:/data

  node2:
    <<: *node
    environment:
      NODE_ID: node2
      NODE_LISTEN_ADDR: ":9102"
      NODE_DATA_DIR: /data
      NODE_MAX_CONCURRENT_READS: "32"
      NODE_MAX_CONCURRENT_WRITES: "16"
      GOMEMLIMIT: 288MiB
      COORDINATOR_ADDR: coordinator:9090
      NODE_HEARTBEAT_INTERVAL: 2s
    ports:
      - "127.0.0.1:9102:9102"
    volumes:
      - node2-data:/data

  node3:
    <<: *node
    environment:
      NODE_ID: node3
      NODE_LISTEN_ADDR: ":9103"
      NODE_DATA_DIR: /data
      NODE_MAX_CONCURRENT_READS: "32"
      NODE_MAX_CONCURRENT_WRITES: "16"
      GOMEMLIMIT: 288MiB
      COORDINATOR_ADDR: coordinator:9090
      NODE_HEARTBEAT_INTERVAL: 2s
    ports:
      - "127.0.0.1:9103:9103"
    volumes:
      - node3-data:/data

  node4:
    <<: *node
    environment:
      NODE_ID: node4
      NODE_LISTEN_ADDR: ":9104"
      NODE_DATA_DIR: /data
      NODE_MAX_CONCURRENT_READS: "32"
      NODE_MAX_CONCURRENT_WRITES: "16"
      GOMEMLIMIT: 288MiB
      COORDINATOR_ADDR: coordinator:9090
      NODE_HEARTBEAT_INTERVAL: 2s
    ports:
      - "127.0.0.1:9104:9104"
    volumes:
      - node4-data:/data

  # The HTTP API (stage 10). Stateless: two instances serve the same objects,
  # and restarting one loses nothing. GATEWAY_LISTEN_ADDR is the same port
  # inside the container and on the host. GATEWAY_COORDINATOR is where
  # metadata calls go, each with a GATEWAY_COORDINATOR_TIMEOUT deadline; the
  # gateway asks the coordinator for nodes' internal addresses (node1:9101),
  # which it can reach inside this network. GATEWAY_MAX_CONCURRENT_UPLOADS and
  # _DOWNLOADS: more get 503 with Retry-After at once. GATEWAY_STALL_TIMEOUT:
  # a transfer that moves no chunk for this long is cut off (there is no
  # whole-request timeout). GATEWAY_CHUNK_WRITE_TIMEOUT and _READ_TIMEOUT
  # bound each replica write and read, as osctl's do. GOMEMLIMIT: Go's soft
  # memory limit, under mem_limit above.
  gateway1:
    <<: *gateway
    environment:
      GATEWAY_LISTEN_ADDR: ":9081"
      GATEWAY_COORDINATOR: coordinator:9090
      GATEWAY_COORDINATOR_TIMEOUT: 10s
      GATEWAY_MAX_CONCURRENT_UPLOADS: "8"
      GATEWAY_MAX_CONCURRENT_DOWNLOADS: "16"
      GATEWAY_STALL_TIMEOUT: 30s
      GATEWAY_CHUNK_WRITE_TIMEOUT: 10s
      GATEWAY_CHUNK_READ_TIMEOUT: 10s
      GOMEMLIMIT: 224MiB
    ports:
      - "127.0.0.1:9081:9081"

  gateway2:
    <<: *gateway
    environment:
      GATEWAY_LISTEN_ADDR: ":9082"
      GATEWAY_COORDINATOR: coordinator:9090
      GATEWAY_COORDINATOR_TIMEOUT: 10s
      GATEWAY_MAX_CONCURRENT_UPLOADS: "8"
      GATEWAY_MAX_CONCURRENT_DOWNLOADS: "16"
      GATEWAY_STALL_TIMEOUT: 30s
      GATEWAY_CHUNK_WRITE_TIMEOUT: 10s
      GATEWAY_CHUNK_READ_TIMEOUT: 10s
      GOMEMLIMIT: 224MiB
    ports:
      - "127.0.0.1:9082:9082"

volumes:
  pgdata:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
