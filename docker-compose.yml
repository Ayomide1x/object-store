# One Postgres, one coordinator, four storage nodes. Each chunk is placed on
# three of the four nodes. Every port is bound to 127.0.0.1 only: there is no
# authentication.

# Settings shared by every storage node.
x-node: &node
  build:
    context: .
    dockerfile: node/Dockerfile
  # Healthy once the node's gRPC health service reports SERVING, which it does
  # only after stray temp files are cleaned and the listener is open. The image
  # is distroless (no shell), so the node binary probes itself. `docker compose
  # up --wait` blocks on this.
  healthcheck:
    test: ["CMD", "/node", "health"]
    start_period: 30s
    start_interval: 1s
    interval: 10s
    timeout: 3s
    retries: 3

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: objectstore          # database name
      POSTGRES_USER: objectstore        # superuser created on first start
      POSTGRES_PASSWORD: objectstore    # local development only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql      # PG18 image mount point
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objectstore -d objectstore"]
      interval: 2s
      timeout: 3s
      retries: 30

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/objectstore   # metadata database
      SPRING_DATASOURCE_USERNAME: objectstore
      SPRING_DATASOURCE_PASSWORD: objectstore
      SPRING_GRPC_SERVER_PORT: "9090"                                       # coordinator gRPC port
      # Storage nodes, comma-separated node_id|internal_addr|client_addr.
      # internal_addr: how the coordinator reaches a node (StatChunks at commit).
      # client_addr: returned to osctl on the host.
      COORDINATOR_NODES: >-
        node1|node1:9101|127.0.0.1:9101,node2|node2:9102|127.0.0.1:9102,node3|node3:9103|127.0.0.1:9103,node4|node4:9104|127.0.0.1:9104
      # Deadline for each call to a node. A hung node costs this once per
      # CompleteUpload: each node gets one batched StatChunks call.
      COORDINATOR_NODE_RPC_TIMEOUT: 2s
      # Seconds the JVM caches DNS lookups (successful and failed). Node
      # containers can get new IPs on restart; a long cache keeps calling the
      # old address. On UNAVAILABLE the coordinator also re-resolves and retries.
      COORDINATOR_DNS_CACHE_TTL_SECONDS: "1"
    ports:
      - "127.0.0.1:9090:9090"
    # Healthy once the gRPC server accepts connections, which happens only after
    # Flyway migrations and node registration finish. The probe runs inside the
    # container, so it reaches the real listener, not Docker's host port proxy.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090"]
      start_period: 60s     # JVM start + Flyway; failures here don't count
      start_interval: 1s    # probe rate during start_period
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  # NODE_ID must match an entry in COORDINATOR_NODES. NODE_LISTEN_ADDR uses the
  # same port inside the container and on the host. NODE_DATA_DIR holds chunk
  # files in chunks/ and in-progress writes in tmp/. NODE_MAX_CONCURRENT_READS:
  # reads beyond this get RESOURCE_EXHAUSTED; each holds up to 4 MiB in memory.
  node1:
    <<: *node
    environment:
      NODE_ID: node1
      NODE_LISTEN_ADDR: ":9101"
      NODE_DATA_DIR: /data
      NODE_MAX_CONCURRENT_READS: "32"
    ports:
      - "127.0.0.1:9101:9101"
    volumes:
      - node1-data:/data

  node2:
    <<: *node
    environment:
      NODE_ID: node2
      NODE_LISTEN_ADDR: ":9102"
      NODE_DATA_DIR: /data
      NODE_MAX_CONCURRENT_READS: "32"
    ports:
      - "127.0.0.1:9102:9102"
    volumes:
      - node2-data:/data

  node3:
    <<: *node
    environment:
      NODE_ID: node3
      NODE_LISTEN_ADDR: ":9103"
      NODE_DATA_DIR: /data
      NODE_MAX_CONCURRENT_READS: "32"
    ports:
      - "127.0.0.1:9103:9103"
    volumes:
      - node3-data:/data

  node4:
    <<: *node
    environment:
      NODE_ID: node4
      NODE_LISTEN_ADDR: ":9104"
      NODE_DATA_DIR: /data
      NODE_MAX_CONCURRENT_READS: "32"
    ports:
      - "127.0.0.1:9104:9104"
    volumes:
      - node4-data:/data

volumes:
  pgdata:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
