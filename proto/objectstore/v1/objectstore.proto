syntax = "proto3";

package objectstore.v1;

option go_package = "github.com/Ayomide1x/object-store/gen/go/objectstore/v1;objectstorev1";
option java_multiple_files = true;
option java_package = "io.github.ayomide1x.objectstore.v1";

// CoordinatorService owns all metadata. It never carries object bytes.
service CoordinatorService {
  // InitiateUpload records a PENDING object with its full chunk plan and
  // placement. A PENDING object is not reachable from any key.
  rpc InitiateUpload(InitiateUploadRequest) returns (InitiateUploadResponse);
  // CompleteUpload validates the request against the issued plan, asks every
  // placed node which chunks it durably holds (StatChunks), and commits only if
  // every chunk has at least 2 replicas whose node reports the planned size and
  // the client's SHA-256. It then records exactly those replicas, marks the
  // object COMMITTED and points the key at it, in one transaction. Fewer than 2
  // verified replicas for any chunk: FAILED_PRECONDITION. An existing key is
  // overwritten. Completing an already COMMITTED object succeeds without changes.
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  // GetObject returns the chunk list and replica locations for a key.
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
}

message InitiateUploadRequest {
  string key = 1;
  int64 size_bytes = 2;
}

message InitiateUploadResponse {
  reserved 2;
  reserved "chunk";

  string object_id = 1;
  // Ordered by index. Empty for a 0-byte object.
  repeated ChunkPlacement chunks = 3;
}

message ChunkPlacement {
  string chunk_id = 1;
  repeated NodeLocation nodes = 2;
  int32 index = 3;
  // Chunk boundaries are decided by the coordinator.
  int64 size_bytes = 4;
}

message NodeLocation {
  string node_id = 1;
  // Address reachable by the caller (a client-facing address for clients).
  string address = 2;
}

message CompleteUploadRequest {
  string object_id = 1;
  string key = 2;
  int64 size_bytes = 3;
  repeated CompletedChunk chunks = 4;
}

message CompletedChunk {
  string chunk_id = 1;
  int32 index = 2;
  int64 size_bytes = 3;
  // Ignored since stage 4: the coordinator asks the placed nodes what they hold
  // instead of trusting the client's list.
  repeated string acked_node_ids = 4 [deprecated = true];
  // SHA-256 of the chunk data, as verified by the acknowledging nodes. Required:
  // a complete without it is rejected.
  bytes sha256 = 5;
}

message CompleteUploadResponse {}

message GetObjectRequest {
  string key = 1;
}

message GetObjectResponse {
  string object_id = 1;
  int64 size_bytes = 2;
  repeated ChunkInfo chunks = 3;
}

message ChunkInfo {
  string chunk_id = 1;
  int32 index = 2;
  int64 size_bytes = 3;
  repeated NodeLocation replicas = 4;
  // SHA-256 of the chunk data. Readers verify each chunk end to end against it.
  bytes sha256 = 5;
}

// StorageNodeService stores and serves chunk bytes. Every stream is framed in
// messages of at most 1 MiB of data. Every byte served has been checked against
// its SHA-256 first.
service StorageNodeService {
  // WriteChunk takes exactly one header frame, then data frames, then exactly
  // one trailer frame carrying the SHA-256 of the data. The chunk becomes
  // visible only after the hash matches and the file is durable.
  rpc WriteChunk(stream WriteChunkRequest) returns (WriteChunkResponse);
  rpc ReadChunk(ReadChunkRequest) returns (stream ReadChunkResponse);
  // StatChunks reports, for each requested chunk, whether this node durably
  // holds a verified copy: a valid header naming that chunk under its final
  // name. It reads only headers, not data. One call covers every chunk of an
  // object placed on this node.
  rpc StatChunks(StatChunksRequest) returns (StatChunksResponse);
}

message WriteChunkRequest {
  oneof frame {
    WriteChunkHeader header = 1;
    bytes data = 2;
    WriteChunkTrailer trailer = 3;
  }
}

message WriteChunkHeader {
  string chunk_id = 1;
  // For logging only; the node does not interpret it.
  string object_id = 2;
  int64 size_bytes = 3;
}

// WriteChunkTrailer is the last frame of a write. The sender hashes the data
// as it streams it, so the file is read only once.
message WriteChunkTrailer {
  // SHA-256 of the chunk data: exactly 32 bytes.
  bytes sha256 = 1;
}

message WriteChunkResponse {
  string chunk_id = 1;
  int64 bytes_written = 2;
  // The SHA-256 the node verified and stored.
  bytes sha256 = 3;
}

message ReadChunkRequest {
  string chunk_id = 1;
}

message ReadChunkResponse {
  bytes data = 1;
}

message StatChunksRequest {
  repeated string chunk_ids = 1;
}

message StatChunksResponse {
  // One entry per requested chunk ID, in request order.
  repeated ChunkStat stats = 1;
  // The responding node's ID. The coordinator records facts about a node only
  // from a response that identifies as that node, so a call misdirected by a
  // stale address can never credit one node's chunks to another.
  string node_id = 2;
}

message ChunkStat {
  enum State {
    STATE_UNSPECIFIED = 0;
    // A valid header naming this chunk: the write was verified and is durable.
    STATE_FOUND = 1;
    // No file under the chunk's final name.
    STATE_MISSING = 2;
    // A file exists but its header is invalid or names another chunk.
    STATE_BAD_HEADER = 3;
  }
  string chunk_id = 1;
  State state = 2;
  // Set when state is STATE_FOUND: data size and the SHA-256 from the header.
  int64 size_bytes = 3;
  bytes sha256 = 4;
}
