syntax = "proto3";

package objectstore.v1;

option go_package = "github.com/Ayomide1x/object-store/gen/go/objectstore/v1;objectstorev1";
option java_multiple_files = true;
option java_package = "io.github.ayomide1x.objectstore.v1";

// CoordinatorService owns all metadata. It never carries object bytes.
service CoordinatorService {
  // InitiateUpload records a PENDING object with its full chunk plan and
  // placement. A PENDING object is not reachable from any key.
  rpc InitiateUpload(InitiateUploadRequest) returns (InitiateUploadResponse);
  // CompleteUpload validates the request against the issued plan, asks every
  // placed node which chunks it durably holds (StatChunks), and commits only if
  // every chunk has at least 2 replicas whose node reports the planned size and
  // the client's SHA-256. It then records exactly those replicas, marks the
  // object COMMITTED and points the key at it, in one transaction. Fewer than 2
  // verified replicas for any chunk: FAILED_PRECONDITION. An existing key is
  // overwritten. Completing an object that already committed (COMMITTED, or
  // since SUPERSEDED or DELETED) succeeds without changes. An upload abandoned
  // by garbage collection (PENDING past the pending timeout) fails with
  // FAILED_PRECONDITION and can never commit.
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  // GetObject returns the chunk list and the HEALTHY replica locations for a
  // key. Replicas marked BAD are left out. If any chunk has no healthy replica,
  // it fails with DATA_LOSS naming the chunk and each replica's recorded reason.
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
  // ReportBadReplica is a client's hint that a replica served bad data or none.
  // The coordinator marks the replica BAD only if the node itself confirms it
  // (VerifyChunk); the verdict says what happened. Reading never depends on it.
  rpc ReportBadReplica(ReportBadReplicaRequest) returns (ReportBadReplicaResponse);
  // Heartbeat tells the coordinator a node is alive. Nodes call it on an
  // interval; the coordinator judges liveness by its own clock at receipt.
  // An unregistered node_id fails with NOT_FOUND; a second process claiming
  // a node_id that is still beating fails with FAILED_PRECONDITION. Rejected
  // beats do not count as signs of life.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // DeleteObject removes a key. In one transaction the key stops resolving
  // and the object it pointed to becomes DELETED; its chunk files are deleted
  // later, by garbage collection, after a read grace period, so a get that
  // already holds the chunk list finishes. A key that does not resolve:
  // NOT_FOUND.
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);
  // ListObjects returns the keys that currently resolve, in key order, one
  // page at a time (keyset pagination: see ListObjectsRequest).
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
  // StatObject describes the object a key resolves to, with every recorded
  // replica of every chunk in any state. For inspection: readers use GetObject.
  rpc StatObject(StatObjectRequest) returns (StatObjectResponse);
  // GetClusterStatus describes the cluster for observers: node liveness, the
  // number of chunks below the replication target (counted exactly as the
  // reconciler counts), pending chunk deletions, and recent repair and garbage
  // collection passes. It is read-only: it writes nothing and triggers nothing.
  rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);
}

// NodeAddressSet says which of a node's addresses a caller can reach.
enum NodeAddressSet {
  // Treated as NODE_ADDRESS_SET_CLIENT, so callers that predate the field
  // keep getting the addresses they always got.
  NODE_ADDRESS_SET_UNSPECIFIED = 0;
  // Client-facing addresses, for callers outside the cluster network (osctl
  // on the host).
  NODE_ADDRESS_SET_CLIENT = 1;
  // Addresses inside the cluster network, as the coordinator and nodes use
  // them (a gateway running next to the nodes).
  NODE_ADDRESS_SET_INTERNAL = 2;
}

message DeleteObjectRequest {
  string key = 1;
}

message DeleteObjectResponse {
  // The object the key pointed to, now DELETED.
  string object_id = 1;
}

message ListObjectsRequest {
  // Only keys starting with this prefix; empty lists every key.
  string prefix = 1;
  // Only keys after this one (exclusive), in key order. Empty starts at the
  // beginning. To page, pass the previous response's next_start_after.
  string start_after = 2;
  // Keys per page. 0 means the maximum, 1000; larger values are clamped to
  // 1000; negative values are INVALID_ARGUMENT.
  int32 limit = 3;
}

message ListObjectsResponse {
  repeated ObjectSummary objects = 1;
  // The last key of this page when at least one more key follows; empty when
  // this page is the last. Keys committed after the first page may or may not
  // appear in later pages, but no key is listed twice and no key that resolves
  // throughout the listing is skipped.
  string next_start_after = 2;
}

message ObjectSummary {
  string key = 1;
  string object_id = 2;
  int64 size_bytes = 3;
  // When the object committed, in milliseconds since the Unix epoch.
  // Informational only: it does not define version order.
  int64 committed_at_unix_millis = 4;
}

message StatObjectRequest {
  string key = 1;
}

message StatObjectResponse {
  string object_id = 1;
  int64 size_bytes = 2;
  int64 committed_at_unix_millis = 3;
  // Ordered by index.
  repeated ChunkStatus chunks = 4;
}

message ChunkStatus {
  string chunk_id = 1;
  int32 index = 2;
  int64 size_bytes = 3;
  bytes sha256 = 4;
  // Every recorded replica, by node ID.
  repeated ReplicaStatus replicas = 5;
}

message ReplicaStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_HEALTHY = 1;
    // Confirmed corrupt or missing by its node; never served to readers.
    STATE_BAD = 2;
  }
  string node_id = 1;
  State state = 2;
  // How the row came to exist: "upload", "repair" or "repair-found".
  string origin = 3;
  NodeLiveness liveness = 4;
  // Set when state is STATE_BAD.
  string bad_reason = 5;
}

// NodeLiveness is a node's state as the coordinator sees it from heartbeats.
// It can be wrong (a node can be up but unable to reach the coordinator), so
// it orders and excludes, but never alone decides what data exists.
enum NodeLiveness {
  NODE_LIVENESS_UNSPECIFIED = 0;
  // Beating within the SUSPECT threshold.
  NODE_LIVENESS_ALIVE = 1;
  // Missed beats past the SUSPECT threshold.
  NODE_LIVENESS_SUSPECT = 2;
  // Missed beats past the DEAD threshold, or recovering from DEAD.
  NODE_LIVENESS_DEAD = 3;
  // Not heard from since the coordinator started.
  NODE_LIVENESS_UNKNOWN = 4;
}

message GetClusterStatusRequest {
  // How many recent passes of each kind to return. 0 means 10; larger values
  // are clamped to 100; negative values are INVALID_ARGUMENT.
  int32 recent_passes = 1;
}

message GetClusterStatusResponse {
  // Every registered node, by node ID.
  repeated NodeStatus nodes = 1;
  // Chunks of current objects with fewer than 3 replicas that count: HEALTHY
  // rows on nodes that are ALIVE, SUSPECT, or DEAD for less than the repair
  // grace. The reconciler's own rule.
  int64 under_replicated_chunks = 2;
  // Chunk files waiting to be deleted by garbage collection.
  int64 pending_deletions = 3;
  // The most recent pass of each kind, whatever it did; unset if none ran.
  RepairPass last_repair_pass = 4;
  GcPass last_gc_pass = 5;
  // The most recent passes that did any work or were skipped, newest first.
  repeated RepairPass recent_repair_passes = 6;
  repeated GcPass recent_gc_passes = 7;
}

message NodeStatus {
  string node_id = 1;
  // As the coordinator sees it now, from heartbeats.
  NodeLiveness liveness = 2;
  // When the node entered its persisted state, in milliseconds since the Unix
  // epoch; 0 if never recorded. Wall clock, informational only.
  int64 liveness_since_unix_millis = 3;
  // The last persisted heartbeat (persisted at most every 10 s); 0 if none.
  int64 last_heartbeat_unix_millis = 4;
}

// A reconciler pass, as recorded in repair_passes.
message RepairPass {
  int64 pass_id = 1;
  int64 started_at_unix_millis = 2;
  // 0 while the pass is running.
  int64 finished_at_unix_millis = 3;
  // Set when the pass did nothing on purpose (for example a node UNKNOWN).
  string skipped_reason = 4;
  int32 under_replicated = 5;
  int32 copies_started = 6;
  int32 replicas_recorded = 7;
  int32 found_recorded = 8;
  int32 bad_found = 9;
  int32 failures = 10;
}

// A garbage collection pass, as recorded in gc_passes.
message GcPass {
  int64 pass_id = 1;
  int64 started_at_unix_millis = 2;
  // 0 while the pass is running.
  int64 finished_at_unix_millis = 3;
  string skipped_reason = 4;
  int32 abandoned = 5;
  int32 superseded = 6;
  int32 tasks_created = 7;
  int32 files_deleted = 8;
  int32 already_absent = 9;
  int32 failures = 10;
  int32 objects_removed = 11;
}

message HeartbeatRequest {
  string node_id = 1;
  // Random per node process; tells a restart apart from two processes
  // claiming one node_id.
  string instance_id = 2;
}

message HeartbeatResponse {
  // The node's state as the coordinator sees it after this beat.
  NodeLiveness liveness = 1;
}

message InitiateUploadRequest {
  string key = 1;
  int64 size_bytes = 2;
  // Which node addresses to return in the plan.
  NodeAddressSet node_addresses = 3;
}

message InitiateUploadResponse {
  reserved 2;
  reserved "chunk";

  string object_id = 1;
  // Ordered by index. Empty for a 0-byte object.
  repeated ChunkPlacement chunks = 3;
}

message ChunkPlacement {
  string chunk_id = 1;
  repeated NodeLocation nodes = 2;
  int32 index = 3;
  // Chunk boundaries are decided by the coordinator.
  int64 size_bytes = 4;
}

message NodeLocation {
  string node_id = 1;
  // Address reachable by the caller (a client-facing address for clients).
  string address = 2;
  // The node's liveness when the response was built. Readers try ALIVE
  // replicas first and DEAD ones last, but never skip a listed replica.
  NodeLiveness liveness = 3;
}

message CompleteUploadRequest {
  string object_id = 1;
  string key = 2;
  int64 size_bytes = 3;
  repeated CompletedChunk chunks = 4;
}

message CompletedChunk {
  string chunk_id = 1;
  int32 index = 2;
  int64 size_bytes = 3;
  // Ignored since stage 4: the coordinator asks the placed nodes what they hold
  // instead of trusting the client's list.
  repeated string acked_node_ids = 4 [deprecated = true];
  // SHA-256 of the chunk data, as verified by the acknowledging nodes. Required:
  // a complete without it is rejected.
  bytes sha256 = 5;
}

message CompleteUploadResponse {}

message GetObjectRequest {
  string key = 1;
  // Which node addresses to return for the replicas.
  NodeAddressSet node_addresses = 2;
}

message GetObjectResponse {
  string object_id = 1;
  int64 size_bytes = 2;
  repeated ChunkInfo chunks = 3;
}

message ChunkInfo {
  string chunk_id = 1;
  int32 index = 2;
  int64 size_bytes = 3;
  repeated NodeLocation replicas = 4;
  // SHA-256 of the chunk data. Readers verify each chunk end to end against it.
  bytes sha256 = 5;
}

message ReportBadReplicaRequest {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The node answered NOT_FOUND for a chunk it is recorded as holding.
    REASON_NOT_FOUND = 1;
    // The node refused to serve the chunk: its own verification failed.
    REASON_DATA_LOSS = 2;
    // The node served bytes whose size or SHA-256 differs from the record.
    REASON_CHECKSUM_MISMATCH = 3;
  }
  string chunk_id = 1;
  string node_id = 2;
  Reason reason = 3;
  // Free text for logs, such as the error the client saw.
  string detail = 4;
}

message ReportBadReplicaResponse {
  enum Verdict {
    VERDICT_UNSPECIFIED = 0;
    // The node confirmed the replica is corrupt or missing; it is now BAD.
    VERDICT_MARKED_BAD = 1;
    // The replica was already BAD.
    VERDICT_ALREADY_BAD = 2;
    // The node says the replica is healthy; nothing was marked.
    VERDICT_CONTRADICTED = 3;
    // The node did not answer, or the answer came from another node; nothing was marked.
    VERDICT_UNCONFIRMED = 4;
    // No such replica is recorded.
    VERDICT_NOT_A_REPLICA = 5;
  }
  Verdict verdict = 1;
}

// StorageNodeService stores and serves chunk bytes. Every stream is framed in
// messages of at most 1 MiB of data. Every byte served has been checked against
// its SHA-256 first.
service StorageNodeService {
  // WriteChunk takes exactly one header frame, then data frames, then exactly
  // one trailer frame carrying the SHA-256 of the data. The chunk becomes
  // visible only after the hash matches and the file is durable.
  rpc WriteChunk(stream WriteChunkRequest) returns (WriteChunkResponse);
  rpc ReadChunk(ReadChunkRequest) returns (stream ReadChunkResponse);
  // StatChunks reports, for each requested chunk, whether this node durably
  // holds a verified copy: a valid header naming that chunk under its final
  // name. It reads only headers, not data. One call covers every chunk of an
  // object placed on this node.
  rpc StatChunks(StatChunksRequest) returns (StatChunksResponse);
  // VerifyChunk re-reads a whole chunk and checks its header, its data against
  // the stored SHA-256, and the stored SHA-256 against expected_sha256 (the
  // coordinator's record). It counts against the node's concurrent read limit.
  rpc VerifyChunk(VerifyChunkRequest) returns (VerifyChunkResponse);
  // PushChunk copies a chunk this node holds to another node, for
  // re-replication ordered by the coordinator (which never carries the
  // bytes). The node first verifies its own copy, header, chunk ID and data
  // hash, and checks the hash equals expected_sha256, the coordinator's record;
  // then it writes to the target through the target's ordinary WriteChunk.
  // Problems with this node's copy are status errors (DATA_LOSS, NOT_FOUND,
  // RESOURCE_EXHAUSTED); what happened at the target is the outcome. The
  // coordinator records nothing from this response: it asks the target.
  rpc PushChunk(PushChunkRequest) returns (PushChunkResponse);
  // DeleteChunks removes chunk files, for garbage collection ordered by the
  // coordinator. It is idempotent: a chunk with no file counts as removed
  // (OUTCOME_ALREADY_ABSENT). With tombstone set, the node first records,
  // durably, that the chunk ID is deleted, and from then on refuses any write
  // of it, so a late upload or copy can never bring the file back. Deletion
  // never modifies a file: it removes the name, so a read that already opened
  // the file finishes normally. The response names the node, and the
  // coordinator records a deletion only from the node itself.
  rpc DeleteChunks(DeleteChunksRequest) returns (DeleteChunksResponse);
}

message WriteChunkRequest {
  oneof frame {
    WriteChunkHeader header = 1;
    bytes data = 2;
    WriteChunkTrailer trailer = 3;
  }
}

message WriteChunkHeader {
  string chunk_id = 1;
  // For logging only; the node does not interpret it.
  string object_id = 2;
  int64 size_bytes = 3;
}

// WriteChunkTrailer is the last frame of a write. The sender hashes the data
// as it streams it, so the file is read only once.
message WriteChunkTrailer {
  // SHA-256 of the chunk data: exactly 32 bytes.
  bytes sha256 = 1;
}

message WriteChunkResponse {
  string chunk_id = 1;
  int64 bytes_written = 2;
  // The SHA-256 the node verified and stored.
  bytes sha256 = 3;
}

message ReadChunkRequest {
  string chunk_id = 1;
}

message ReadChunkResponse {
  bytes data = 1;
}

message StatChunksRequest {
  repeated string chunk_ids = 1;
}

message StatChunksResponse {
  // One entry per requested chunk ID, in request order.
  repeated ChunkStat stats = 1;
  // The responding node's ID. The coordinator records facts about a node only
  // from a response that identifies as that node, so a call misdirected by a
  // stale address can never credit one node's chunks to another.
  string node_id = 2;
}

message ChunkStat {
  enum State {
    STATE_UNSPECIFIED = 0;
    // A valid header naming this chunk: the write was verified and is durable.
    STATE_FOUND = 1;
    // No file under the chunk's final name.
    STATE_MISSING = 2;
    // A file exists but its header is invalid or names another chunk.
    STATE_BAD_HEADER = 3;
  }
  string chunk_id = 1;
  State state = 2;
  // Set when state is STATE_FOUND: data size and the SHA-256 from the header.
  int64 size_bytes = 3;
  bytes sha256 = 4;
}

message VerifyChunkRequest {
  string chunk_id = 1;
  bytes expected_sha256 = 2;
}

message VerifyChunkResponse {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Header valid, data matches the stored hash, stored hash matches expected.
    STATE_HEALTHY = 1;
    // Any check failed; detail says which.
    STATE_CORRUPT = 2;
    // No file under the chunk's final name.
    STATE_MISSING = 3;
  }
  // The responding node's ID (see StatChunksResponse.node_id).
  string node_id = 1;
  string chunk_id = 2;
  State state = 3;
  string detail = 4;
}

message PushChunkRequest {
  string chunk_id = 1;
  bytes expected_sha256 = 2;
  string target_node_id = 3;
  // The target's address as nodes reach it (its internal address).
  string target_address = 4;
}

message PushChunkResponse {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // The target acknowledged a verified, durable write.
    OUTCOME_COPIED = 1;
    // The target answered ALREADY_EXISTS: it holds some file under that name.
    OUTCOME_TARGET_HAS_CHUNK = 2;
    // The target was unreachable, timed out, or rejected the write.
    OUTCOME_TARGET_FAILED = 3;
  }
  // The pushing (source) node's ID.
  string node_id = 1;
  string chunk_id = 2;
  Outcome outcome = 3;
  string detail = 4;
}

message DeleteChunksRequest {
  repeated ChunkDeletion chunks = 1;
  // The node the coordinator means to address. A node with another ID refuses
  // the whole request (FAILED_PRECONDITION) and deletes nothing, so a stale
  // address can never delete another node's copies. Required.
  string node_id = 2;
}

message ChunkDeletion {
  string chunk_id = 1;
  // Refuse every later write of this chunk ID. Set when the chunk's object is
  // gone; unset when only this node's bad copy is removed, so a good copy can
  // be written here again.
  bool tombstone = 2;
}

message DeleteChunksResponse {
  // The responding node's ID (see StatChunksResponse.node_id).
  string node_id = 1;
  // One entry per requested chunk, in request order.
  repeated ChunkDeletionResult results = 2;
}

message ChunkDeletionResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // The file existed and is now removed, durably.
    OUTCOME_DELETED = 1;
    // There was no file under the chunk's final name.
    OUTCOME_ALREADY_ABSENT = 2;
  }
  string chunk_id = 1;
  Outcome outcome = 2;
}
