# Defaults only. Deployment config comes from environment variables, which are
# documented in docker-compose.yml.
spring:
  application:
    name: coordinator
  main:
    web-application-type: none
  grpc:
    server:
      port: 9090
      # Clients ping every 10 s without calls (nodes' heartbeats, gateways);
      # permit half that, so pings that arrive a little early never close a
      # good connection ("too many pings"). Code constants, not deploy config:
      # they must line up with the clients' (DECISIONS.md, stage 11).
      keepalive:
        permit:
          time: 5s
          without-calls: true
logging:
  structured:
    format:
      console: logstash
